; P2PhysFix settings. Put this file next to prototype2.exe.
; The physics crash fix is always on; it has no settings.

[Window]
; 1 = borderless window at desktop resolution.
;     Turns on the borderless mode built into the 2025 Steam build (same as the launch options
;     "-windowed -borderless", no need to set them in Steam). Faster alt+tab, no display mode switch.
; 0 = leave the game's own fullscreen/windowed choice alone.
Borderless = 0

; 1 = keep the Windows mouse cursor hidden while the game is active (the game draws its own cursor).
;     Fixes the engine's unbalanced ShowCursor calls in borderless/windowed mode, which leave the Windows arrow
;     on top of the game after start or alt+tab (and make the AMD performance overlay flicker).
; 0 = leave the cursor to the game.
HideCursor = 1

; 1 = keep the mouse cursor inside the game window while the game is active (multi-monitor setups:
;     the cursor cannot wander onto another screen). Released on alt+tab. Needs HideCursor = 1.
; 0 = do not confine.
ConfineCursor = 1

; 1 = the game minimizes itself when it loses focus (original behavior).
; 0 = the game stays on screen when you alt+tab (handy with two monitors). Avoids the D3D reset on every
;     alt+tab, so overlays such as AMD's performance overlay no longer flicker for a few seconds on return.
MinimizeOnFocusLoss = 1

[Engine]
; Number of engine worker threads (physics/jobs), 1..7. 0 = leave it to the game / PrototypeFix.
; The engine uses (CPU threads - 2), which crashes on load on CPUs with more than 9 threads.
; PrototypeFix's CPUThreadCountFix forces 4, and with 4 workers the engine's data slowly gets corrupted:
; after a few minutes the character drifts in flight, the camera jumps and Esc stops opening the pause menu.
; The game was built for quad cores, i.e. 2 workers. 2 also overrides CPUThreadCountFix.
WorkerThreads = 2

[CommandLine]
; Extra engine options to switch on, separated by spaces (flags only, no "name=value").
; Example: NoSleepOnLostFocus   (keeps full speed when the game window loses focus)
Options =
